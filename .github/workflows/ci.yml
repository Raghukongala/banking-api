name: Enterprise CI

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm test -- --coverage

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info

      - name: Build Docker Image
        run: docker build -t banking-api:${{ github.sha }} .

      - name: Run Docker Container
        run: |
          docker run -d --name banking-container-test -p 3000:3000 banking-api:${{ github.sha }}

      - name: Wait for Application
        run: |
          for i in {1..10}; do
            if curl --fail --silent http://127.0.0.1:3000/health; then
              exit 0
            fi
            sleep 2
          done
          echo "Health check failed"
          exit 1

      - name: Check Running Containers
        run: docker ps -a

      - name: Show Container Logs
        run: docker logs banking-container-test

      - name: Verify Health Endpoint
        run: |
          curl --fail http://127.0.0.1:3000/health

      - name: Run Trivy filesystem scan
        id: trivy
        continue-on-error: true
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            aquasec/trivy:latest \
            fs \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --format sarif \
            --output trivy-results.sarif \
            .

      - name: Upload Trivy SARIF report
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy

      - name: Stop Container
        if: always()
        run: docker stop banking-container-test || true

      - name: Remove Container
        if: always()
        run: docker rm banking-container-test || true