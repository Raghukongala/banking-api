name: Enterprise CI

on:
  push:
    branches:
      - main
      - 'feature/**'

  pull_request:
    branches:
      - main


permissions:
  contents: read
  pull-requests: read
  security-events: write


env:
  IMAGE_NAME: banking-api
  IMAGE_TAG: latest


jobs:

  build:

    name: Build Security Quality Pipeline

    runs-on: ubuntu-latest

    timeout-minutes: 20


    steps:


      # -----------------------------
      # Checkout Repository
      # -----------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4



      # -----------------------------
      # Setup Node.js
      # -----------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm



      # -----------------------------
      # Install Dependencies
      # -----------------------------
      - name: Install Dependencies
        run: npm ci



      # -----------------------------
      # Verify Repository
      # -----------------------------
      - name: Verify Repository Files
        run: |
          ls -la
          pwd



      # -----------------------------
      # Application Validation
      # -----------------------------
      - name: Run Application Validation
        run: |
          node app.js &
          sleep 10
          ps aux | grep node



      # -----------------------------
      # Docker Build
      # -----------------------------
      - name: Build Docker Image
        env:
          DOCKER_BUILDKIT: 1
        run: |
          docker build \
          --no-cache \
          -t $IMAGE_NAME:$IMAGE_TAG .



      # -----------------------------
      # Docker Image Verification
      # -----------------------------
      - name: Verify Docker Image
        run: |
          docker images
          docker run --rm $IMAGE_NAME:$IMAGE_TAG node --version
          docker run --rm $IMAGE_NAME:$IMAGE_TAG npm --version
          docker run --rm $IMAGE_NAME:$IMAGE_TAG npm ls tar || true



      # -----------------------------
      # Setup Trivy Cache
      # -----------------------------
      - name: Cache Trivy Database
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db



      # -----------------------------
      # Trivy Filesystem Scan
      # -----------------------------
      - name: Trivy Filesystem Scan
        run: |
          docker run --rm \
          -v "${{ github.workspace }}:/workspace" \
          -v ~/.cache/trivy:/root/.cache/trivy \
          -w /workspace \
          aquasec/trivy:latest \
          fs \
          --format table \
          --severity HIGH,CRITICAL \
          --ignore-unfixed \
          --exit-code 1 .



      # -----------------------------
      # Trivy Docker Image Scan
      # -----------------------------
      - name: Trivy Docker Image Scan
        run: |
          docker run --rm \
          -v /var/run/docker.sock:/var/run/docker.sock \
          -v ~/.cache/trivy:/root/.cache/trivy \
          aquasec/trivy:latest \
          image \
          --format table \
          --severity HIGH,CRITICAL \
          --ignore-unfixed \
          --exit-code 1 \
          $IMAGE_NAME:$IMAGE_TAG



      # -----------------------------
      # SonarQube Analysis
      # -----------------------------
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5

        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

        with:
          args: >
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}