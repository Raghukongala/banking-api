name: Enterprise CI

on:
  push:
    branches:
      - main
      - feature/**

  pull_request:
    branches:
      - main


permissions:
  contents: read
  pull-requests: write
  packages: write


jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0


      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm


      - name: Install Dependencies
        run: npm ci


      - name: Run Unit Tests
        run: npm test -- --coverage


      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info


      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        run: |
          IMAGE_NAME=ghcr.io/${{ github.repository_owner }}/banking-api

          docker build \
            -t $IMAGE_NAME:${{ github.sha }} .

          docker push \
            $IMAGE_NAME:${{ github.sha }}


      - name: Run Docker Container
        run: |
          docker run -d \
          --name banking-container-test \
          -p 3000:3000 \
          banking-api:${{ github.sha }}


      - name: Wait for Application
        run: |
          for i in {1..10}; do
            if curl --fail --silent http://127.0.0.1:3000/health; then
              exit 0
            fi
            sleep 2
          done

          echo "Health check failed"
          exit 1


      - name: Check Running Containers
        run: docker ps -a


      - name: Show Container Logs
        run: docker logs banking-container-test


      - name: Verify Health Endpoint
        run: |
          curl --fail http://127.0.0.1:3000/health


      # Trivy Open Source Scan
      - name: Run Trivy Filesystem Scan
        continue-on-error: true
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            aquasec/trivy:latest \
            fs \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --format table \
            .


      # Generate Report File
      - name: Generate Trivy Report
        if: always()
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            aquasec/trivy:latest \
            fs \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --format json \
            --output trivy-report.json \
            .


      # Post Report in Pull Request
      - name: Comment Trivy Report on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'trivy-report.json';
            let body = '## 🔐 Trivy Security Scan Report\n\n**Scanner:** Trivy Open Source\n\n**Severity Checked:**\n- HIGH\n- CRITICAL\n\n';

            if (fs.existsSync(path)) {
              const report = fs.readFileSync(path, 'utf8');
              body += `Report:\n\n\`\`\`json\n${report.substring(0, 3000)}\n\`\`\`\n`;
            } else {
              body += 'No report was generated.';
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });


      - name: Stop Container
        if: always()
        run: |
          docker stop banking-container-test || true


      - name: Remove Container
        if: always()
        run: |
          docker rm banking-container-test || true
