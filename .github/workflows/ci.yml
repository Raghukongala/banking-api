name: Enterprise CI

on:
  push:
    branches:
      - main
      - 'feature/**'

  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:

  build:
    name: Build Security Quality Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:

      # -----------------------------
      # Checkout Repository
      # -----------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4


      # -----------------------------
      # Setup Node.js
      # -----------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20


      # -----------------------------
      # Install Dependencies
      # (uses npm ci if a lock file exists, falls back to npm install if not)
      # -----------------------------
      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            echo "Lock file found, running npm ci"
            npm ci
          else
            echo "No lock file found, running npm install"
            npm install
          fi


      # -----------------------------
      # Verify Repository
      # -----------------------------
      - name: Verify Repository Files
        run: |
          ls -la
          pwd


      # -----------------------------
      # Application Validation
      # -----------------------------
      - name: Run Application
        run: |
          node app.js &
          sleep 10
          curl -f http://localhost:3000/health || (echo "App failed to start" && exit 1)


      # -----------------------------
      # Docker Build
      # -----------------------------
      - name: Build Docker Image
        run: docker build -t banking-api:latest .


      # -----------------------------
      # Trivy Filesystem Scan (direct container - bypasses trivy-action dependency issues)
      # -----------------------------
      - name: Trivy Filesystem Scan
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            aquasecurity/trivy:latest \
            fs --format table --severity CRITICAL,HIGH --exit-code 1 .


      # -----------------------------
      # Trivy Docker Image Scan (direct container - bypasses trivy-action dependency issues)
      # -----------------------------
      - name: Trivy Docker Image Scan
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            aquasecurity/trivy:latest \
            image --format table --severity CRITICAL,HIGH --exit-code 1 banking-api:latest


      # -----------------------------
      # SonarQube Analysis
      # -----------------------------
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5
        continue-on-error: false
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

        with:
          args: >
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}