name: Enterprise CI


on:

  push:
    branches:
      - main
      - 'feature/**'

  pull_request:
    branches:
      - main



permissions:

  contents: read
  pull-requests: write
  security-events: write



env:

  IMAGE_NAME: banking-api
  IMAGE_TAG: ${{ github.sha }}



jobs:


  build:


    name: Build Security Quality Pipeline

    runs-on: ubuntu-latest

    timeout-minutes: 30



    steps:


      # ---------------------------------
      # Checkout Code
      # ---------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v5



      # ---------------------------------
      # Setup Node
      # ---------------------------------

      - name: Setup Node.js

        uses: actions/setup-node@v5

        with:

          node-version: '22.23.1'

          cache: npm



      - name: Verify Environment

        run: |

          node -v

          npm -v



      # ---------------------------------
      # Install Dependencies
      # ---------------------------------

      - name: Install Dependencies

        run: npm ci



      # ---------------------------------
      # Unit Testing
      # ---------------------------------

      - name: Run Unit Tests

        run: |

          npm test -- --coverage



      # ---------------------------------
      # SonarCloud Analysis
      # ---------------------------------

      - name: SonarCloud Scan

        uses: SonarSource/sonarqube-scan-action@v6

        env:

          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

        with:

          args: >

            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}

            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}

            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info



      # ---------------------------------
      # Docker Build
      # ---------------------------------

      - name: Build Docker Image

        run: |

          docker build \

          --no-cache \

          -t $IMAGE_NAME:$IMAGE_TAG .



      # ---------------------------------
      # Container Health Validation
      # ---------------------------------

      - name: Container Health Check

        run: |


          docker run -d \

          --name banking-container \

          -p 3000:3000 \

          $IMAGE_NAME:$IMAGE_TAG


          sleep 10


          curl --fail http://localhost:3000/health


          docker stop banking-container

          docker rm banking-container



      # ---------------------------------
      # Trivy Cache
      # ---------------------------------

      - name: Cache Trivy Database

        uses: actions/cache@v5

        with:

          path: ~/.cache/trivy

          key: trivy-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}



      # ---------------------------------
      # Trivy Filesystem Scan
      # ---------------------------------

      - name: Trivy Filesystem Scan

        run: |


          docker run --rm \

          -v "${{ github.workspace }}:/workspace" \

          -v ~/.cache/trivy:/root/.cache/trivy \

          -w /workspace \

          aquasec/trivy:latest \

          fs \

          --scanners vuln \

          --severity HIGH,CRITICAL \

          --ignore-unfixed \

          --exit-code 1 \

          .



      # ---------------------------------
      # Trivy Image Scan
      # ---------------------------------

      - name: Trivy Image Scan

        run: |


          docker run --rm \

          -v /var/run/docker.sock:/var/run/docker.sock \

          -v ~/.cache/trivy:/root/.cache/trivy \

          aquasec/trivy:latest \

          image \

          --severity HIGH,CRITICAL \

          --ignore-unfixed \

          --exit-code 1 \

          $IMAGE_NAME:$IMAGE_TAG



      # ---------------------------------
      # Cleanup
      # ---------------------------------

      - name: Cleanup Docker Resources

        if: always()

        run: |

          docker ps -aq | xargs -r docker rm -f

          docker images