name: Enterprise CI

on:
  push:
    branches:
      - main
      - 'feature/**'

  pull_request:
    branches:
      - main


permissions:
  contents: read
  pull-requests: read
  security-events: write


jobs:

  build:
    name: Build Security Quality Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 20


    steps:


      # -----------------------------
      # Checkout Repository
      # -----------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4


      # -----------------------------
      # Setup Node.js
      # -----------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm


      # -----------------------------
      # Install Dependencies
      # -----------------------------
      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi


      # -----------------------------
      # Verify Repository
      # -----------------------------
      - name: Verify Repository Files
        run: |
          ls -la
          pwd


      # -----------------------------
      # Application Validation
      # -----------------------------
      - name: Run Application
        run: |
          node app.js &
          sleep 10
          ps aux | grep node


      # -----------------------------
      # Docker Build
      # -----------------------------
      - name: Build Docker Image
        run: |
          docker build \
          --no-cache \
          -t banking-api:latest .


      # -----------------------------
      # Docker Image Verification
      # -----------------------------
      - name: Verify Docker Image
        run: |
          docker images
          docker run --rm banking-api:latest node --version
          docker run --rm banking-api:latest npm --version
          docker run --rm banking-api:latest npm ls tar || true


      # -----------------------------
      # Trivy Filesystem Scan
      # -----------------------------
      - name: Trivy Filesystem Scan
        run: |
          docker run --rm \
          -v "${{ github.workspace }}:/workspace" \
          -w /workspace \
          aquasec/trivy:latest \
          fs \
          --format table \
          --severity HIGH,CRITICAL \
          --ignore-unfixed \
          --exit-code 1 .


      # -----------------------------
      # Trivy Docker Image Scan
      # -----------------------------
      - name: Trivy Docker Image Scan
        run: |
          docker run --rm \
          -v /var/run/docker.sock:/var/run/docker.sock \
          aquasec/trivy:latest \
          image \
          --format table \
          --severity HIGH,CRITICAL \
          --ignore-unfixed \
          --exit-code 1 \
          banking-api:latest



      # -----------------------------
      # SonarQube Analysis
      # -----------------------------
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5

        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

        with:
          args: >
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}