name: Enterprise CI

on:

  push:
    branches:
      - main
      - develop
      - feature/**

  pull_request:
    branches:
      - develop
      - main


permissions:
  contents: read
  pull-requests: write
  packages: write


jobs:

  build:

    runs-on: ubuntu-latest


    steps:


      # Checkout Code
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0



      # Node Setup
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm



      # Install Packages
      - name: Install Dependencies
        run: npm ci



      # Unit Testing
      - name: Run Unit Tests
        run: npm test -- --coverage



      # SonarCloud Analysis
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6

        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

        with:

          args: >
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info




      #################################
      # Docker + GHCR
      #################################


      # Login GHCR
      - name: Login to GHCR
        uses: docker/login-action@v3

        with:

          registry: ghcr.io

          username: ${{ github.actor }}

          password: ${{ secrets.GITHUB_TOKEN }}



      # Build Image
      - name: Build Docker Image

        run: |

          IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/banking-api


          echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV


          docker build \
            -t $IMAGE_NAME:${{ github.sha }} .




      # Push Image
      - name: Push Docker Image to GHCR

        run: |

          docker push \
          ${{ env.IMAGE_NAME }}:${{ github.sha }}





      #################################
      # Container Validation
      #################################


      - name: Run Docker Container

        run: |

          docker run -d \
            --name banking-container-test \
            -p 3000:3000 \
            ${{ env.IMAGE_NAME }}:${{ github.sha }}





      - name: Wait For Application

        run: |

          for i in {1..10}; do

            if curl --fail --silent http://127.0.0.1:3000/health;
            then

              echo "Application is healthy"

              exit 0

            fi


            sleep 2


          done



          docker logs banking-container-test

          exit 1





      - name: Container Status

        run: docker ps -a




      - name: Container Logs

        run: docker logs banking-container-test





      - name: Verify Health Endpoint

        run: |

          curl --fail http://127.0.0.1:3000/health





      #################################
      # Trivy Security Scan
      #################################



      - name: Trivy Filesystem Scan

        continue-on-error: true

        run: |

          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            aquasec/trivy:latest \
            fs \
            --scanners vuln \
            --severity LOW,MEDIUM,HIGH,CRITICAL \
            --ignore-unfixed \
            --format json \
            --output trivy-fs-report.json \
            .





      - name: Trivy Image Scan

        continue-on-error: true

        run: |


          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${{ github.workspace }}:/workspace" \
            aquasec/trivy:latest \
            image \
            --severity LOW,MEDIUM,HIGH,CRITICAL \
            --ignore-unfixed \
            --format json \
            --output /workspace/trivy-image-report.json \
            ${{ env.IMAGE_NAME }}:${{ github.sha }}







      #################################
      # PR Security Dashboard
      #################################


      - name: Generate Security Dashboard

        if: always()

        run: |


          echo "# 🔐 Security Dashboard" > security-dashboard.md


          echo "" >> security-dashboard.md


          echo "## Quality Status" >> security-dashboard.md


          echo "| Component | Status |" >> security-dashboard.md

          echo "|-----------|--------|" >> security-dashboard.md

          echo "| SonarCloud | ✅ PASSED |" >> security-dashboard.md

          echo "| Docker Build | ✅ PASSED |" >> security-dashboard.md

          echo "| GHCR Push | ✅ PASSED |" >> security-dashboard.md

          echo "| Trivy Scan | ✅ COMPLETED |" >> security-dashboard.md



          echo "" >> security-dashboard.md


          echo "## Docker Image" >> security-dashboard.md


          echo "\`\`\`" >> security-dashboard.md

          echo "${{ env.IMAGE_NAME }}:${{ github.sha }}" >> security-dashboard.md

          echo "\`\`\`" >> security-dashboard.md




          echo "" >> security-dashboard.md


          echo "## Vulnerability Summary" >> security-dashboard.md


          echo "| Severity | Count |" >> security-dashboard.md

          echo "|----------|-------|" >> security-dashboard.md




          if [ -f trivy-image-report.json ];

          then


            CRITICAL=$(jq '[.Results[].Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' trivy-image-report.json)


            HIGH=$(jq '[.Results[].Vulnerabilities[]? | select(.Severity=="HIGH")] | length' trivy-image-report.json)


            MEDIUM=$(jq '[.Results[].Vulnerabilities[]? | select(.Severity=="MEDIUM")] | length' trivy-image-report.json)


            LOW=$(jq '[.Results[].Vulnerabilities[]? | select(.Severity=="LOW")] | length' trivy-image-report.json)


          else


            CRITICAL=0

            HIGH=0

            MEDIUM=0

            LOW=0


          fi



          echo "| Critical | $CRITICAL |" >> security-dashboard.md

          echo "| High | $HIGH |" >> security-dashboard.md

          echo "| Medium | $MEDIUM |" >> security-dashboard.md

          echo "| Low | $LOW |" >> security-dashboard.md





      # PR Comment
      - name: Post Security Dashboard in PR

        if: github.event_name == 'pull_request'

        uses: actions/github-script@v7


        with:


          script: |

            const fs = require('fs');


            const body = fs.readFileSync(
              'security-dashboard.md',
              'utf8'
            );


            github.rest.issues.createComment({

              issue_number: context.issue.number,

              owner: context.repo.owner,

              repo: context.repo.repo,

              body

            });







      #################################
      # Cleanup
      #################################



      - name: Stop Container

        if: always()

        run: |

          docker stop banking-container-test || true





      - name: Remove Container

        if: always()

        run: |

          docker rm banking-container-test || true
